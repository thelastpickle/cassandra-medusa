syntax = "proto3";

service Medusa {
  rpc Backup(BackupRequest) returns (BackupResponse);

  rpc AsyncBackup(BackupRequest) returns (BackupResponse);

  rpc BackupStatus(BackupStatusRequest) returns (BackupStatusResponse);

  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse);

  rpc GetBackup(GetBackupRequest) returns (GetBackupResponse);

  rpc GetBackups(GetBackupsRequest) returns (GetBackupsResponse);

  rpc PurgeBackups(PurgeBackupsRequest) returns (PurgeBackupsResponse);

  rpc PrepareRestore(PrepareRestoreRequest) returns (PrepareRestoreResponse);
  rpc GetCommitLogArchiveStatus(GetCommitLogArchiveStatusRequest) returns (GetCommitLogArchiveStatusResponse);
  rpc PreparePitrRestore(PreparePitrRestoreRequest) returns (PreparePitrRestoreResponse);
}

enum StatusType {
  IN_PROGRESS = 0;
  SUCCESS = 1;
  FAILED = 2;
  UNKNOWN = 3;
}

message BackupRequest {
  string name = 1;
  enum Mode {
    DIFFERENTIAL = 0;
    FULL = 1;
  }
  Mode   mode = 2;
}

message BackupResponse {
  string           backupName = 1;
  StatusType       status = 2;
}

message BackupStatusRequest {
  string backupName = 1;
}

message BackupStatusResponse {
  string           startTime = 1;
  string           finishTime = 2;
  StatusType       status = 3;
}

message DeleteBackupRequest {
  string name = 1;
}

message DeleteBackupResponse {
  string name = 1;
  StatusType status = 2;
}

message GetBackupRequest {
  string backupName = 1;
}

message GetBackupResponse {
  BackupSummary backup = 1;
  StatusType    status = 2;
}

message GetBackupsRequest {
}

message GetBackupsResponse {
  repeated BackupSummary backups = 1;
  StatusType overallStatus = 2;
}

message BackupSummary {
  string              backupName = 1;
  int64               startTime = 2;
  int64               finishTime = 3;
  int32               totalNodes = 4;
  int32               finishedNodes = 5;
  repeated BackupNode nodes = 6;
  StatusType          status = 7;
  string              backupType = 8;
  int64               totalSize = 9;
  int64               totalObjects = 10;
}

message BackupNode {
  string         host = 1;
  repeated int64 tokens = 2;
  string         datacenter = 3;
  string         rack = 4;
}

message PurgeBackupsRequest {
}

message PurgeBackupsResponse {
  int32     nbBackupsPurged = 1;
  int32     nbObjectsPurged = 2;
  int64     totalPurgedSize = 3;
  int32     totalObjectsWithinGcGrace = 4;
}

message PrepareRestoreRequest {
  string backupName = 1;
  string datacenter = 2;
  string restoreKey = 3;
}

message PrepareRestoreResponse {
}

message GetCommitLogArchiveStatusRequest {
}

message GetCommitLogArchiveStatusResponse {
  bool       running         = 1;
  int64      lastUploadTime  = 2;  // Unix epoch seconds; 0 if never uploaded
  int32      pendingCount    = 3;  // segments in spool not yet uploaded
  int32      intervalSeconds = 4;
  StatusType status          = 5;
  string     lastError       = 6;  // non-empty when the last poll could not read the spool directory; empty otherwise
}

message PreparePitrRestoreRequest {
  string targetTimestamp = 1;  // Unix epoch float string or ISO-8601 (UTC)
  string datacenter      = 2;  // Cassandra DC to restore; scopes the base-backup check to this DC
}

message PreparePitrRestoreResponse {
  StatusType          status           = 1;
  map<string, string> nodeBaseBackups  = 2;  // node FQDN -> backup name
  double              targetTimestamp  = 3;  // echo of the parsed target timestamp (Unix epoch float)
}
