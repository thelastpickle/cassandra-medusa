[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true

[program:cassandra]
command=/usr/local/bin/cassandra-start.sh
user=cassandra
autorestart=true
stdout_logfile=/var/log/cassandra-stdout.log
stderr_logfile=/var/log/cassandra-stderr.log

[program:cassandra-log-tail]
; Tail /var/log/cassandra/system.log to stdout so it appears in docker logs.
; Waits for the file to be created by Cassandra before tailing.
command=sh -c 'until [ -f /var/log/cassandra/system.log ]; do sleep 1; done; exec tail -F /var/log/cassandra/system.log'
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sshd]
command=/usr/sbin/sshd -D
autorestart=true
stdout_logfile=/var/log/sshd.log
stderr_logfile=/var/log/sshd-err.log
