[storage]
storage_provider = local
bucket_name = cassandra_backups
fqdn = localhost

[pitr]
enabled = true
commitlog_archive_interval_seconds = 120
commitlog_spool_dir = /data/cassandra/commitlog_spool
commitlog_staging_dir = /data/cassandra/commitlog_staging
commitlog_restore_grace_period_seconds = 7200
